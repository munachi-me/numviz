<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Numviz examples</title>
    <style>
      body { margin: 0; padding: 32px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 28px; margin-bottom: 4px; }
      p { color: #64748b; }
      ul { padding-left: 20px; line-height: 2; }
      a { color: #4f46e5; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 24px; }
      .card { display: block; padding: 18px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; text-decoration: none; color: inherit; }
      .card strong { display: block; margin-bottom: 4px; }
      .card span { color: #64748b; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Numviz examples</h1>
      <p>Framework-free charts backed by the same public API.</p>
      <div class="grid">
        <a class="card" href="bar.html"><strong>Bar chart</strong><span>Object records, axis and tooltips</span></a>
        <a class="card" href="line.html"><strong>Line chart</strong><span>Trend over time</span></a>
        <a class="card" href="pie.html"><strong>Pie chart</strong><span>Share of total with legend</span></a>
        <a class="card" href="doughnut.html"><strong>Doughnut chart</strong><span>Centre total and data labels</span></a>
        <a class="card" href="numiq-dataset.html"><strong>Numiq dataset</strong><span>Column and row dataset input</span></a>
        <a class="card" href="columns.html"><strong>Array columns</strong><span>Array-of-arrays input</span></a>
      </div>
    </main>
  </body>
</html>
