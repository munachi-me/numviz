name: Publish packages

run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Manual {0}', inputs.dry_run && 'dry run' || 'publish') }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the package without publishing
        type: boolean
        default: true
      dist_tag:
        description: Dist-tag for manual publication
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  contents: read
  id-token: write # npm Trusted Publishing through GitHub Actions OIDC
  packages: write # GitHub Packages through the workflow GITHUB_TOKEN

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: "@munachi-me/numviz"
      NPM_REGISTRY: "https://registry.npmjs.org"
      GITHUB_REGISTRY: "https://npm.pkg.github.com"
      GITHUB_NPMRC: ${{ github.workspace }}/.github-packages.npmrc
    steps:
      - uses: actions/checkout@v6
      # No registry-url on purpose. setup-node would write an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, which can shadow npm Trusted Publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          node --version
          npm --version
          node_major="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$node_major" -lt 24 ]; then
            echo "::error::Node.js 24 or newer is required for this publish workflow."
            exit 1
          fi
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is older than the required 11.5.1."
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: Resolve publication plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "release" ]; then
            mode="release"
            if [ "$RELEASE_PRERELEASE" = "true" ]; then tag="next"; else tag="latest"; fi
          else
            mode="publish"
            if [ "$INPUT_DRY_RUN" = "true" ]; then mode="dry-run"; fi
            tag="${INPUT_DIST_TAG:-latest}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Publication plan"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`$PACKAGE_NAME\` |"
            echo "| Version | \`$version\` |"
            echo "| Mode | \`$mode\` |"
            echo "| Dist-tag | \`$tag\` |"
            echo "| Registries | npm, GitHub Packages |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Packages authentication
        run: |
          set -euo pipefail
          {
            echo "@munachi-me:registry=$GITHUB_REGISTRY"
            echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN"
          } > "$GITHUB_NPMRC"
          chmod 600 "$GITHUB_NPMRC"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check published versions
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.version }}"
          npm_found=false
          github_found=false
          if npm view "$PACKAGE_NAME@$version" version --registry="$NPM_REGISTRY" >/dev/null 2>&1; then
            npm_found=true
          fi
          if NPM_CONFIG_USERCONFIG="$GITHUB_NPMRC" npm view "$PACKAGE_NAME@$version" version --registry="$GITHUB_REGISTRY" >/dev/null 2>&1; then
            github_found=true
          fi
          echo "npm=$npm_found" >> "$GITHUB_OUTPUT"
          echo "github=$github_found" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Registry state"
            echo
            echo "- npm: \`$npm_found\`"
            echo "- GitHub Packages: \`$github_found\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject duplicate publication
        if: steps.plan.outputs.mode != 'dry-run' && steps.published.outputs.npm == 'true' && steps.published.outputs.github == 'true'
        run: |
          echo "::error::Version ${{ steps.plan.outputs.version }} already exists in both npm and GitHub Packages. Bump package.json before publishing."
          exit 1
      - name: Preflight npm OIDC environment
        if: steps.plan.outputs.mode != 'dry-run' && steps.published.outputs.npm != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC is unavailable. The job needs 'permissions: id-token: write' and a GitHub-hosted runner."
            exit 1
          fi
          echo "GitHub Actions OIDC request environment is available."
          echo "This preflight does not prove that npm Trusted Publishing is configured."
      - name: Verify npm package (dry run)
        if: steps.plan.outputs.mode == 'dry-run'
        run: npm publish --registry="$NPM_REGISTRY" --access public --dry-run
      - name: Verify GitHub Packages package (dry run)
        if: steps.plan.outputs.mode == 'dry-run'
        env:
          NPM_CONFIG_USERCONFIG: ${{ env.GITHUB_NPMRC }}
        run: |
          set -euo pipefail
          npm whoami --registry="$GITHUB_REGISTRY"
          npm publish --registry="$GITHUB_REGISTRY" --access public --dry-run
      - name: Record dry-run result
        if: steps.plan.outputs.mode == 'dry-run'
        run: |
          {
            echo
            echo "### Dry run complete"
            echo
            echo "No package was published. This run verified packaging and GitHub Packages authentication."
            echo
            echo "npm Trusted Publishing is **not** validated by a dry run. Only a real npm publication proves the OIDC exchange and Trusted Publisher configuration."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to npm
        if: steps.plan.outputs.mode != 'dry-run' && steps.published.outputs.npm != 'true'
        # No NPM_TOKEN or NODE_AUTH_TOKEN: npm exchanges the GitHub Actions
        # OIDC identity token for short-lived publishing credentials.
        run: npm publish --registry="$NPM_REGISTRY" --access public --tag "$DIST_TAG" --provenance
        env:
          DIST_TAG: ${{ steps.plan.outputs.tag }}
      - name: Publish to GitHub Packages
        if: steps.plan.outputs.mode != 'dry-run' && steps.published.outputs.github != 'true'
        run: npm publish --registry="$GITHUB_REGISTRY" --access public --tag "$DIST_TAG"
        env:
          NPM_CONFIG_USERCONFIG: ${{ env.GITHUB_NPMRC }}
          DIST_TAG: ${{ steps.plan.outputs.tag }}
      - name: Verify npm publication
        if: steps.plan.outputs.mode != 'dry-run'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DIST_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            published="$(npm view "$PACKAGE_NAME@$VERSION" version --registry="$NPM_REGISTRY" 2>/dev/null || true)"
            tarball="$(npm view "$PACKAGE_NAME@$VERSION" dist.tarball --registry="$NPM_REGISTRY" 2>/dev/null || true)"
            tag_version="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" --registry="$NPM_REGISTRY" 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ] && [ -n "$tarball" ] && [ "$tag_version" = "$VERSION" ]; then
              echo "npm verification passed: $PACKAGE_NAME@$VERSION ($DIST_TAG)"
              exit 0
            fi
            echo "npm not ready (attempt $attempt/18): version=$published tag=$tag_version"
            sleep 10
          done
          echo "::error::npm publication verification failed for $PACKAGE_NAME@$VERSION"
          exit 1
      - name: Verify GitHub Packages publication
        if: steps.plan.outputs.mode != 'dry-run'
        env:
          NPM_CONFIG_USERCONFIG: ${{ env.GITHUB_NPMRC }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIST_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            published="$(npm view "$PACKAGE_NAME@$VERSION" version --registry="$GITHUB_REGISTRY" 2>/dev/null || true)"
            tag_version="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" --registry="$GITHUB_REGISTRY" 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ] && [ "$tag_version" = "$VERSION" ]; then
              echo "GitHub Packages verification passed: $PACKAGE_NAME@$VERSION ($DIST_TAG)"
              exit 0
            fi
            echo "GitHub Packages not ready (attempt $attempt/18): version=$published tag=$tag_version"
            sleep 10
          done
          echo "::error::GitHub Packages publication verification failed for $PACKAGE_NAME@$VERSION"
          exit 1
      - name: Record publication result
        if: steps.plan.outputs.mode != 'dry-run'
        run: |
          {
            echo
            echo "### Publication complete"
            echo
            echo "- Verified \`$PACKAGE_NAME@${{ steps.plan.outputs.version }}\` in npm and GitHub Packages."
            echo "- Dist-tag: \`${{ steps.plan.outputs.tag }}\`"
            if [ "${{ steps.published.outputs.npm }}" != "true" ]; then
              echo "- npm publication succeeded through GitHub Actions OIDC."
            else
              echo "- npm version already existed; npm publication was skipped."
            fi
            if [ "${{ steps.published.outputs.github }}" != "true" ]; then
              echo "- GitHub Packages publication used the workflow GITHUB_TOKEN."
            else
              echo "- GitHub Packages version already existed; publication was skipped."
            fi
            echo "- Both registries were verified after publication."
          } >> "$GITHUB_STEP_SUMMARY"
